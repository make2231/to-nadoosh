<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى نادين ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: radial-gradient(circle, #4b102b, #10000c);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

.heart {
  font-size: 120px;
  animation: beat 1s infinite;
  filter: drop-shadow(0 0 25px #ff1744);
}

h1 {
  color: #ffb6d5;
  font-size: 34px;
  text-shadow: 0 0 15px #ff1744;
  margin: 10px;
}

.love {
  color: #ff80ab;
  font-size: 26px;
  text-shadow: 0 0 15px #ff1744;
  animation: beat 1.2s infinite;
  margin: 8px;
}

.subtitle {
  font-size: 18px;
  color: #fff0f6;
  margin-bottom: 15px;
}

button {
  padding: 12px 24px;
  border: none;
  border-radius: 30px;
  background: #ff1744;
  color: white;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 0 15px #ff1744;
  transition: 0.3s;
}

button:hover {
  background: #ff4081;
  transform: scale(1.05);
}

#message {
  display: none;
  width: 90%;
  max-width: 350px;
  padding: 15px;
  line-height: 1.8;
  color: #ffc6df;
  font-size: 19px;
  animation: appear 0.8s ease;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 15px;
  margin-top: 15px;
  backdrop-filter: blur(5px);
}

.sparkle {
  position: fixed;
  bottom: -40px;
  animation: float 8s linear infinite;
  pointer-events: none;
  z-index: -1;
}

@keyframes beat {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.15);
  }
}

@keyframes float {
  0% {
    transform: translateY(0) rotate(0);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  100% {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="heart">❤️</div>

<h1>نادين 💗</h1>

<h2 class="love">Tek aşkım ❤️</h2>

<p class="subtitle">إلى صاحبة الاسم الجميل ✨</p>

<button onclick="showLove()">
افتحي رسالتك 💌
</button>

<p id="message" dir="rtl">
يا نادين ❤️🥹<br>
Tek aşkım 💖<br>
بس لو كنت جنبك، كان خلصت عليكي 😂❤️‍🔥<br>
يا أحلى نادين بالدنيا 💋💕
</p>

<script>
function showLove() {
  const message = document.getElementById("message");
  const button = document.querySelector("button");

  if (message.style.display === "block") {
    message.style.display = "none";
    button.textContent = "افتحي رسالتك 💌";
  } else {
    message.style.display = "block";
    button.textContent = "سكّري الرسالة ❤️";
  }
}

for (let i = 0; i < 30; i++) {
  const heart = document.createElement("div");

  heart.className = "sparkle";
  heart.textContent = ["❤️", "💗", "💕", "✨"][i % 4];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDelay = Math.random() * 8 + "s";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";

  document.body.appendChild(heart);
}
</script>

</body>
</html>
